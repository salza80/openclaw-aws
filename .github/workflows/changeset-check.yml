name: Changeset

on:
  pull_request:

permissions: {}

jobs:
  changeset:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require changeset
        run: |
          CHANGESET_FILES=$(git diff --name-only "origin/${GITHUB_BASE_REF}"...HEAD | grep -E '^\.changeset/.*\.md$' | grep -v '^\.changeset/README\.md$' || true)
          if [ -z "$CHANGESET_FILES" ]; then
            echo "No changeset found. Run: npm run changeset"
            exit 1
          fi
